name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  i18n-and-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Check i18n key coverage (every language, every page)
        run: node scripts/check-i18n.js

      - name: Check HTML validity
        run: python3 scripts/check-html.py

      - name: Check internal links and #anchors
        run: python3 scripts/check-links.py

      - name: Check the search index is up to date
        run: node scripts/build-search-index.js --check

      - name: Unit tests (node:test)
        run: node --test tests/*.test.js

      - name: Check the sitemap lists every page
        run: python3 scripts/build-sitemap.py --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan the full history for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --accept 999 works around LinkedIn returning that status to any
          # non-browser request instead of blocking outright (a link-checker
          # false positive documented across lychee's own issue tracker).
          # formspree.io and the github-readme-stats/streak-stats badge
          # generators are excluded: the former only accepts POST (a GET
          # probe gets 405 by design, not because the endpoint is broken),
          # the latter are free serverless services known to occasionally
          # 503 under load, which isn't something this repo can fix.
          # Links to this repo's own source files are skipped too: GitHub
          # throttles blob pages from CI runners (503), and those files are
          # in the checkout, so their existence is already guaranteed.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --accept 100..=103,200..=299,429,999
            --exclude 'formspree\.io|github-readme-stats\.vercel\.app|github-readme-streak-stats\.herokuapp\.com|github\.com/MateoBourdin/mateobourdin\.github\.io/blob/'
            './**/*.html'
          fail: true
