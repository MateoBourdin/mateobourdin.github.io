name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n-and-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check i18n key coverage (every language, every page)
        run: node scripts/check-i18n.js

      - name: Check HTML validity
        run: python3 scripts/check-html.py

      - name: Check internal links and #anchors
        run: python3 scripts/check-links.py

  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # --accept 999 works around LinkedIn returning that status to any
          # non-browser request instead of blocking outright (a link-checker
          # false positive documented across lychee's own issue tracker).
          # formspree.io and the github-readme-stats/streak-stats badge
          # generators are excluded: the former only accepts POST (a GET
          # probe gets 405 by design, not because the endpoint is broken),
          # the latter are free serverless services known to occasionally
          # 503 under load, which isn't something this repo can fix.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --accept 100..=103,200..=299,429,999
            --exclude 'formspree\.io|github-readme-stats\.vercel\.app|github-readme-streak-stats\.herokuapp\.com'
            './**/*.html'
          fail: true
