name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Analyse Sonar
    runs-on: ubuntu-latest
    # Les PR venant d'un fork n'ont pas accès au secret SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historique complet : Sonar en a besoin pour distinguer le « nouveau code » de la PR.
          fetch-depth: 0

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Fait échouer le check si la Quality Gate n'est pas au vert.
          args: >
            -Dsonar.qualitygate.wait=true
