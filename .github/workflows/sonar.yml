name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Analyse Sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Analyse « secretless » : GitHub fournit un jeton OIDC, échangé contre un jeton Sonar
      # de courte durée. Aucun secret SONAR_TOKEN à stocker dans le dépôt.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historique complet : Sonar en a besoin pour distinguer le « nouveau code » de la PR.
          fetch-depth: 0

      - name: Authentification SonarQube Cloud (OIDC)
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        with:
          # Fait échouer le check si la Quality Gate n'est pas au vert.
          args: >
            -Dsonar.qualitygate.wait=true
