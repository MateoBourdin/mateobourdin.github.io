# Analyse SonarQube Cloud du portfolio (lancée par .github/workflows/sonar.yml)
sonar.organization=mateobourdin
sonar.projectKey=MateoBourdin_mateobourdin.github.io
sonar.projectName=mateobourdin.github.io

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Code tiers et ressources binaires : pas du code écrit pour ce site.
sonar.exclusions=vendor/**,fonts/**,img/**,**/*.min.js,search-index.json,CV/**

# Exclus du calcul de duplication (le reste de l'analyse s'applique toujours) :
# - fichiers de données (textes FR/EN, contenus de cours) : même structure d'une langue à l'autre ;
# - pages HTML : site statique sans moteur de gabarits, l'en-tête, le menu et le pied de page
#   sont recopiés volontairement dans chaque page (la date du pied de page change partout à chaque mise à jour).
sonar.cpd.exclusions=translations.js,cours/*-data.js,**/*.html

sonar.python.version=3

# Site statique sans suite de tests unitaires : la couverture n'est pas mesurée
# (les scripts de scripts/ sont eux-mêmes des vérifications lancées par checks.yml).
# À retirer le jour où des tests JS avec rapport lcov seront ajoutés.
sonar.coverage.exclusions=**/*
