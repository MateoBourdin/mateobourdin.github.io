# Analyse SonarQube Cloud du portfolio (lancée par .github/workflows/sonar.yml)
sonar.organization=mateobourdin
sonar.projectKey=MateoBourdin_mateobourdin.github.io
sonar.projectName=mateobourdin.github.io

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Code tiers et ressources binaires : pas du code écrit pour ce site.
sonar.exclusions=vendor/**,fonts/**,img/**,**/*.min.js,search-index.json,CV/**

# Fichiers de données (textes FR/EN, contenus de cours) : leur structure se répète
# volontairement d'une langue à l'autre, ce n'est pas du code dupliqué.
sonar.cpd.exclusions=translations.js,cours/*-data.js

sonar.python.version=3
